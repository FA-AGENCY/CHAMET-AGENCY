<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Top Up — RAYHAN AGENCY</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:#080b1c;color:#fff;min-height:100vh;padding:16px}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:480px;margin:0 auto}
    .back{display:inline-block;margin-bottom:14px;font-size:13px;color:#a78bfa;font-weight:600}
    .head{text-align:center;margin-bottom:22px}
    .head img{width:90px;margin:0 auto 12px;filter:drop-shadow(0 8px 24px rgba(59,130,246,.4))}
    .head h1{font-size:22px;font-weight:800}
    .head p{font-size:13px;color:#9aa3c7;margin-top:4px}
    .list{display:grid;gap:12px}
    .item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:linear-gradient(165deg,#12183a,#0c1028);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:.2s}
    .item:hover{border-color:rgba(59,130,246,.5);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.35)}
    .item.main{border-color:rgba(59,130,246,.35);background:radial-gradient(circle at 90% 0,rgba(59,130,246,.2),transparent 50%),linear-gradient(165deg,#121a42,#0c1028)}
    .item img{width:56px;height:56px;object-fit:contain;border-radius:12px}
    .item .info{flex:1}
    .item .info .n{font-size:15px;font-weight:800}
    .item .info .s{font-size:11px;color:#9aa3c7;margin-top:2px}
    .item .arrow{color:#6b7280;font-size:18px}
    .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3)}
    .badge.soon{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.3)}
    .footer{text-align:center;padding:20px;font-size:11px;color:#5a6380}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
    .modal-bg.show{display:flex}
    .modal{background:linear-gradient(165deg,#151b3d,#0c1028);border:1px solid rgba(139,92,246,.3);border-radius:22px;padding:28px 24px;max-width:360px;width:100%;text-align:center}
    .modal h3{font-size:18px;font-weight:800;margin-bottom:10px}
    .modal p{font-size:13px;color:#a5b4d4;line-height:1.7;margin-bottom:18px}
    .modal button{padding:11px 28px;border:0;border-radius:12px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="dashboard.html">← Dashboard</a>
    <div class="head">
      <img src="../assets/badge-diamond.png" alt="Diamond">
      <h1>Diamond Top Up</h1>
      <p>আপনার পছন্দের অ্যাপ সিলেক্ট করুন</p>
    </div>
    <div class="list" id="list"></div>
    <div class="footer">Powered by FA-AGENCY™</div>
  </div>

  <div class="modal-bg" id="soonModal">
    <div class="modal">
      <h3>Coming Soon 🚀</h3>
      <p>এই সার্ভিসটি অতি শীঘ্রই চালু করা হবে।<br>আপনাদের সহযোগিতা কামনা করছি।</p>
      <button onclick="document.getElementById('soonModal').classList.remove('show')">ঠিক আছে</button>
    </div>
  </div>

  <script src="../assets/config.js"></script>
  <script>
    var list = document.getElementById('list');
    var providers = (window.RA_CONFIG && RA_CONFIG.diamondProviders) || [];
    providers.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'item' + (p.id === 'chamet' ? ' main' : '');
      var badge = p.status === 'active'
        ? '<span class="badge">Available</span>'
        : '<span class="badge soon">Coming Soon</span>';
      el.innerHTML =
        '<img src="' + p.logo + '" alt="' + p.name + '">' +
        '<div class="info"><div class="n">' + p.name + '</div><div class="s">' + badge + '</div></div>' +
        '<span class="arrow">→</span>';
      el.onclick = function () {
        if (p.status === 'active' && p.href) {
          location.href = p.href;
        } else {
          document.getElementById('soonModal').classList.add('show');
        }
      };
      list.appendChild(el);
    });
  </script>
</body>
</html>
