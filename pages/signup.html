<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — RAYHAN AGENCY</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f4f4;color:#1f1f1f}a{text-decoration:none}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 18px}.auth-shell{width:min(1120px,100%);background:#fff;border-radius:16px;box-shadow:0 10px 35px rgba(0,0,0,.08);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}.visual{margin:18px;background:linear-gradient(145deg,#4a117c 0%,#9f00d6 58%,#650c91 100%);border-radius:8px;min-height:620px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:74px 38px}.visual h2{font-size:34px;margin:0 0 14px}.visual p{max-width:340px;line-height:1.7;margin:0 auto;color:rgba(255,255,255,.9)}.rocket{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);width:150px;height:205px}.rocket-body{position:absolute;left:37px;top:20px;width:76px;height:135px;border-radius:50% 50% 44% 44%;background:linear-gradient(180deg,#fff,#e8ddff);box-shadow:0 0 35px rgba(255,255,255,.35)}.rocket-window{position:absolute;left:57px;top:62px;width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#8f4bff,#2b1160);border:5px solid #fff}.fin{position:absolute;bottom:42px;width:45px;height:60px;background:#d7b8ff}.fin.left{left:15px;border-radius:70% 0 35% 20%;transform:skewY(22deg)}.fin.right{right:15px;border-radius:0 70% 20% 35%;transform:skewY(-22deg)}.flame{position:absolute;left:57px;bottom:0;width:38px;height:70px;background:linear-gradient(#fff,#f4a4ff,#ff4dce);clip-path:polygon(50% 100%,10% 55%,24% 0,50% 22%,76% 0,90% 55%)}.form-side{padding:34px 58px 30px;display:flex;flex-direction:column;justify-content:center}.brand{font-weight:900;color:#6b16a1;font-size:15px;margin-bottom:8px}.form-side h1{font-size:32px;margin:0 0 10px}.sub{color:#7b7b7b;margin:0 0 22px;line-height:1.6}.field{margin-bottom:14px}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:8px}.field input{width:100%;height:50px;border:1px solid #ddd;border-radius:27px;padding:0 18px;font-size:15px;outline:none}.field input:focus{border-color:#9d2ad4;box-shadow:0 0 0 3px rgba(157,42,212,.1)}.register-btn{width:100%;height:50px;border:0;border-radius:27px;background:linear-gradient(90deg,#b9003a,#c8003f);color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:4px}.login-line{text-align:center;color:#777;margin-top:18px;font-size:14px}.login-line a{color:#c00039;font-weight:900}.message{display:none;margin-bottom:14px;padding:11px 13px;border-radius:10px;background:#fff4f7;color:#b00035;font-size:13px}.footer{text-align:center;padding:18px;color:#888;font-size:12px}@media(max-width:800px){.auth-shell{grid-template-columns:1fr}.visual{display:none}.form-side{padding:34px 24px}.page{padding:15px}}
</style>
</head>
<body>
<div class="page"><main class="auth-shell">
<section class="visual"><div><h2>Welcome to RAYHAN AGENCY!</h2><p>একটি Account তৈরি করুন। এরপর Login করে Agency, Host ও অন্যান্য সিস্টেমে প্রবেশ করুন।</p></div><div class="rocket"><div class="rocket-body"></div><div class="rocket-window"></div><div class="fin left"></div><div class="fin right"></div><div class="flame"></div></div></section>
<section class="form-side">
<div class="brand">RAYHAN AGENCY</div><h1>Welcome to RAYHAN AGENCY</h1><p class="sub">নতুন Account তৈরি করতে নিচের তথ্যগুলো পূরণ করুন।</p><div id="message" class="message"></div>
<form id="signupForm">
<div class="field"><label for="fullName">Full Name</label><input id="fullName" type="text" autocomplete="name" placeholder="Enter Full Name" required></div>
<div class="field"><label for="mobile">Mobile Number</label><input id="mobile" type="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required></div>
<div class="field"><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" placeholder="Enter Email Address" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Create Password" minlength="6" required></div>
<div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm Password" minlength="6" required></div>
<button class="register-btn" type="submit">REGISTER</button>
</form><div class="login-line">Already have an account? <a href="login.html">Login</a></div>
</section></main></div><footer class="footer">Powered by FA-AGENCY™</footer>
<script>
document.getElementById('signupForm').addEventListener('submit',function(e){e.preventDefault();
const fullName=document.getElementById('fullName').value.trim(),mobile=document.getElementById('mobile').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;
const message=document.getElementById('message');
if(password!==confirm){message.textContent='Password এবং Confirm Password একই হতে হবে।';message.style.display='block';return;}
const account={fullName,mobile,email,password,username:email};localStorage.setItem('raihanAgencyAccount',JSON.stringify(account));location.href='login.html?created=1';
});
</script>
</body></html>
