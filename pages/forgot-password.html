<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password — RAYHAN AGENCY</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f4f4;color:#222;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(520px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 12px 40px rgba(0,0,0,.08)}.brand{color:#6b16a1;font-weight:900}.card h1{margin:10px 0;font-size:30px}.lead{color:#777;line-height:1.7}.field{margin:18px 0}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:8px}.field input{width:100%;height:50px;border:1px solid #ddd;border-radius:26px;padding:0 17px;font-size:15px}.btn{width:100%;height:50px;border:0;border-radius:26px;background:linear-gradient(90deg,#b9003a,#c8003f);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.back{text-align:center;margin-top:18px}.back a{color:#b00035;font-weight:800}.msg{display:none;padding:11px 13px;background:#fff4f7;color:#b00035;border-radius:10px;font-size:13px;margin-bottom:14px}.footer{position:fixed;bottom:15px;color:#888;font-size:12px}
</style><link rel="stylesheet" href="../assets/rayhan-theme.css"></head><body><div class="card"><div class="brand">RAYHAN AGENCY</div><h1>Forgot Password?</h1><p class="lead">আপনার Email অথবা Mobile Number দিন। Account পাওয়া গেলে নতুন Password সেট করতে পারবেন।</p><div id="msg" class="msg"></div><form id="forgotForm"><div class="field"><label>Email / Mobile Number</label><input id="identity" required placeholder="Enter Email or Mobile"></div><div class="field"><label>New Password</label><input id="newPassword" type="password" minlength="6" required placeholder="Enter New Password"></div><div class="field"><label>Confirm New Password</label><input id="confirmPassword" type="password" minlength="6" required placeholder="Confirm New Password"></div><button class="btn">RESET PASSWORD</button></form><div class="back"><a href="auth.html?mode=login">← Back to Login</a></div></div><footer class="footer">Powered by FA-AGENCY™</footer>
<script>document.getElementById('forgotForm').addEventListener('submit',function(e){e.preventDefault();const id=document.getElementById('identity').value.trim().toLowerCase(),a=JSON.parse(localStorage.getItem('raihanAgencyAccount')||'null'),msg=document.getElementById('msg');if(!a||((a.email||'').toLowerCase()!==id&&(a.mobile||'').toLowerCase()!==id)){msg.textContent='এই Email/Mobile দিয়ে কোনো Account পাওয়া যায়নি।';msg.style.display='block';return}const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p!==c){msg.textContent='নতুন Password দুটি একই হতে হবে।';msg.style.display='block';return}a.password=p;localStorage.setItem('raihanAgencyAccount',JSON.stringify(a));location.href='auth.html?mode=login';});</script></body></html>
