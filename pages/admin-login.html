<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — RAYHAN AGENCY</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 50% 0,#29105b,#07091f 55%);color:#fff}.box{width:min(440px,90%);background:#101638;border:1px solid #ffffff18;border-radius:24px;padding:30px;box-shadow:0 30px 80px #0007}.logo{width:210px;display:block;margin:0 auto 18px}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff18;background:#090d28;color:#fff;box-sizing:border-box}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#6e42ff,#e33cf0);color:#fff;font-weight:900;cursor:pointer}.err{display:none;background:#ff3e7320;color:#ff9db8;border:1px solid #ff3e7344;padding:10px;border-radius:10px;font-size:12px}.footer{text-align:center;color:#8e97bd;font-size:12px;margin-top:18px}</style><link rel="stylesheet" href="../assets/rayhan-theme.css"></head><body class="admin-shell"><main class="box"><img class="logo" src="../assets/rayhan-agency-logo.svg"><h1 style="text-align:center;margin:0 0 6px">Admin Dashboard</h1><p style="text-align:center;color:#aeb7dc;margin-top:0">Secure administrator access</p><div id="err" class="err">Invalid Admin Gmail or Password.</div><form id="f"><div class="field"><label>Admin Gmail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Admin Password</label><input id="pw" type="password" autocomplete="current-password" required></div><button class="btn">LOGIN TO ADMIN</button></form><div class="footer">Powered by FA-AGENCY™</div></main><script>const ADMIN_EMAIL='raihankhan4341@gmail.com',ADMIN_PASSWORD='zxcvbnm@123';document.getElementById('f').onsubmit=e=>{e.preventDefault();if(document.getElementById('email').value.trim().toLowerCase()===ADMIN_EMAIL&&document.getElementById('pw').value===ADMIN_PASSWORD){sessionStorage.setItem('faAdmin','1');location.href='admin.html'}else document.getElementById('err').style.display='block'}</script></body></html>
