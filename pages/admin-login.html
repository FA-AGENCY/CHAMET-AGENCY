<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FA-AGENCY™ Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050816;color:#fff;font-family:Arial,sans-serif}.card{width:min(420px,calc(100% - 40px));padding:28px;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 70px rgba(0,0,0,.4)}h1{margin:0 0 8px}.small{color:#9ba2bd;font-size:13px;line-height:1.6}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;color:#c7cbe0}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #303650;background:#0c1124;color:#fff;box-sizing:border-box}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#625bff;color:#fff;font-weight:800;cursor:pointer}</style></head><body><div class="card"><h1>FA-AGENCY™</h1><div class="small">Admin Panel Login</div><div class="field"><label>Admin Gmail</label><input id="email" type="email" placeholder="admin@gmail.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password"></div><button class="btn" onclick="login()">LOGIN TO ADMIN PANEL</button><p class="small">Default: admin@gmail.com / FAADMIN2026</p></div><script>function login(){const e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;if(e==='admin@gmail.com'&&p==='FAADMIN2026'){sessionStorage.faAdmin='1';location.href='admin.html'}else alert('Invalid admin Gmail or password')}</script><footer class="fa-agency-footer">Powered by FA-AGENCY™</footer>
</body></html>
