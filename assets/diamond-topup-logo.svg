<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer circle -->
  <circle cx="100" cy="100" r="90" fill="#0c1228" stroke="url(#g)" stroke-width="4"/>
  <!-- diamond shape -->
  <g filter="url(#glow)" transform="translate(100,88)">
    <polygon points="0,-48 42,-8 0,52 -42,-8" fill="url(#g2)" stroke="#bfdbfe" stroke-width="2"/>
    <polygon points="0,-48 42,-8 0,8" fill="#93c5fd" opacity="0.55"/>
    <polygon points="0,-48 -42,-8 0,8" fill="#60a5fa" opacity="0.35"/>
    <line x1="-42" y1="-8" x2="42" y2="-8" stroke="#dbeafe" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- label -->
  <text x="100" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#e0e7ff">DIAMOND</text>
  <text x="100" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#93c5fd">TOP UP</text>
</svg>
